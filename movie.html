<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie · Moviebase</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html"><span class="dot"></span>Moviebase</a>
</header>

<main>
  <a class="back-link" href="index.html">&larr; Back</a>
  <div id="movie-detail" class="movie-detail"></div>
</main>

<footer>Moviebase</footer>

<script>
  const API_URL = "https://moviebase-backend-0c76.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const detail = document.getElementById("movie-detail");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  fetch(API_URL + "/movies/" + encodeURIComponent(id))
    .then(function(res) { return res.json(); })
    .then(function(movie) {
      if (!movie || movie.status === "not found") {
        detail.innerHTML = "<p class='state-msg'>Movie not found.</p>";
        return;
      }
      detail.innerHTML =
        "<video controls src='" + escapeHtml(movie.videoUrl) + "'></video>" +
        "<h1>" + escapeHtml(movie.title) + "</h1>" +
        "<p class='meta'><span>" + escapeHtml(movie.year) + "</span><span>Rating " + escapeHtml(movie.rating) + "</span></p>" +
        "<p class='desc'>" + escapeHtml(movie.description) + "</p>";
    })
    .catch(function(err) {
      detail.innerHTML = "<p class='state-msg'>Could not load movie.</p>";
      console.error(err);
    });
</script>

</body>
</html>
