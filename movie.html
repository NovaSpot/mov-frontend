<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Movie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button onclick="window.location.href='index.html'">Back to Home</button>

<div id="movie-detail"></div>

<script src="movies.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const movie = movies.find(function(m) { return m.id == id; });

  const detail = document.getElementById("movie-detail");

  if (movie) {
    detail.innerHTML =
      "<h1>" + movie.title + "</h1>" +
      "<video controls width='600' src='" + movie.videoUrl + "'></video>" +
      "<p>" + movie.year + " | Rating: " + movie.rating + "</p>" +
      "<p>" + movie.description + "</p>";
  } else {
    detail.innerHTML = "<p>Movie not found.</p>";
  }
</script>

</body>
</html>
