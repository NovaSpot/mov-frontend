<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moviebase</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="brand" href="index.html"><span class="dot"></span>Moviebase</a>
</header>

<main>
  <p class="page-title">Browse</p>
  <div id="movies" class="grid"></div>
</main>

<footer>Moviebase</footer>

<script>
  const API_URL = "https://moviebase-backend-0c76.onrender.com";
  const container = document.getElementById("movies");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  fetch(API_URL + "/movies")
    .then(function(res) { return res.json(); })
    .then(function(movies) {
      if (!movies || movies.length === 0) {
        container.innerHTML = "<p class='state-msg'>No movies available.</p>";
        return;
      }
      container.innerHTML = "";
      movies.forEach(function(movie) {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = function() {
          window.location.href = "movie.html?id=" + encodeURIComponent(movie.id);
        };
        card.innerHTML =
          "<img class='thumb' src='" + escapeHtml(movie.thumbnail) + "' alt='' loading='lazy'>" +
          "<div class='body'>" +
            "<h3>" + escapeHtml(movie.title) + "</h3>" +
            "<p class='meta'><span>" + escapeHtml(movie.year) + "</span><span class='rating'>" + escapeHtml(movie.rating) + "</span></p>" +
            "<p class='desc'>" + escapeHtml(movie.description) + "</p>" +
          "</div>";
        container.appendChild(card);
      });
    })
    .catch(function(err) {
      container.innerHTML = "<p class='state-msg'>Could not load movies.</p>";
      console.error(err);
    });
</script>

</body>
</html>
